services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kanban-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    networks: [kanban]

  nginx:
    image: nginx:1.27-alpine
    container_name: kanban-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks: [kanban]

  mysql:
    image: mysql:8.0
    container_name: kanban-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kanban
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [kanban]

  redis:
    image: redis:7-alpine
    container_name: kanban-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks: [kanban]

  reverb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kanban-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/html
    depends_on:
      - redis
    networks: [kanban]

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kanban-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=2"]
    volumes:
      - ./:/var/www/html
    depends_on:
      - redis
      - mysql
    networks: [kanban]

networks:
  kanban:
    driver: bridge

volumes:
  mysql_data:
